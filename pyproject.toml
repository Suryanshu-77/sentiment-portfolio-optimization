[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sdpo"
version = "0.1.0"
description = "Sentiment-driven portfolio optimization"
requires-python = ">=3.13"
# torch is installed separately (CUDA or CPU index); see README.
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17",
    "yfinance>=0.2.50",
    "transformers>=4.46",
    "datasets>=3.0",
    "sentencepiece>=0.2",
    "accelerate>=1.0",
    "vaderSentiment>=3.3.2",
    "PyPortfolioOpt>=1.5.6",
    "cvxpy>=1.6",
    "scikit-learn>=1.5",
    "streamlit>=1.40",
    "plotly>=5.24",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
